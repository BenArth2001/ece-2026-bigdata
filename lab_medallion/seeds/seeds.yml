seeds:
  - name: states
    description: Codes des états, territoires et régions militaires US (référence pour stg_users.state).
    columns:
      - name: code
        data_tests:
          - unique
          - not_null
  - name: state_zip_ranges
    description: >
      Plages de codes ZIP valides par état (préfixes à 3 chiffres de l'USPS, un état peut avoir
      plusieurs plages). Sert à détecter les couples état / ZIP incohérents.
    columns:
      - name: state
        data_tests:
          - relationships:
              arguments:
                to: ref('states')
                field: code
